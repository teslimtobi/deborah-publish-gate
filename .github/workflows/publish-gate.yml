name: Publish gate 

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-gate:
    name: Check clinical sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run the publish gate
        run: npm run check